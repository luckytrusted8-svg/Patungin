name: patungin
description: "Aplikasi Split Bill dengan Scan Struk - Patungin"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Local Database
  drift: ^2.24.2
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Scanning & OCR
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0

  # Sharing & Export
  share_plus: ^10.1.4

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.24.2
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.0
  mocktail: ^1.0.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/patungin_icon_square_1024.png"
  adaptive_icon_background: "#0D9488"
  adaptive_icon_foreground: "assets/icon/patungin_icon_foreground_1024.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
